
[workspace]
resolver = "3"
members = [
    "crates/tkg-common",
    "crates/tkg-mcp",
    "crates/tkg-hooks",
    "crates/tkg-ctrl",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.6"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Jerónimo Capelle"]
repository = "https://github.com/JeronimoCapelle/torqkage"
documentation = "https://jeronimocapelle.github.io/torqkage/"
readme = "README.md"
keywords = ["mcp", "ai", "agents", "sandbox", "cli"]
categories = [
    "command-line-utilities",
    "development-tools",
    "config",
    "os::linux-apis",
]

[workspace.dependencies]
# Internal workspace crates
tkg-common = { path = "crates/tkg-common", version = "0.1.6" }

# Serialization & Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9"
toml = "1.2"
toml_edit = "0.25"

# Error Handling & Systems Utilities
thiserror = "2.0"
bitflags = "2.13"
which = "8.0"
command-group = "5.0"
nix = "0.27"
mpatch = "1.8"
jiff = "0.2"
regex = "1.13"
anstream = "1.0"
globset = "0.4"
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
tempfile = "3.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
rustc-hash = "2.1"
rusqlite = { version = "0.41", features = ["bundled"] }

# Asynchronous Runtime (for tkg-mcp stdio transport)
tokio = { version = "1.54", features = ["full"] }

# Terminal UI (for offline tkg configuration deck)
ratatui = "0.30"
crossterm = "0.29"

# Testing & Benchmarking
divan = "0.1"
gungraun = "0.20"
proptest = "1.6"
insta = { version = "1.42", features = ["json", "yaml"] }

# ==============================================================================
# WORKSPACE COMPILER LINTS
# ==============================================================================
[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(loom)', 'cfg(shuttle)', 'cfg(kani)', 'cfg(fuzzing)']

[workspace.lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious  = { level = "deny", priority = -1 }
style       = { level = "warn", priority = -1 }
complexity  = { level = "warn", priority = -1 }
perf        = { level = "warn", priority = -1 }
pedantic    = { level = "warn", priority = -1 }
cargo       = { level = "warn", priority = -1 }

# Curated high-signal `nursery` lints (avoids experimental false positives)
use_self = "warn"
suboptimal_flops = "warn"
equatable_if_let = "warn"
derive_partial_eq_without_eq = "warn"
debug_assert_with_mut_call = "warn"

# Noisy pedantic/cargo rules disabled to avoid boilerplate workarounds
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
redundant_pub_crate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
format_push_string = "allow"

# Hard Invariants
semicolon_if_nothing_returned = "forbid"
undocumented_unsafe_blocks = "forbid"
multiple_unsafe_ops_per_block = "forbid"
allow_attributes_without_reason = "deny"

# Memory & Clone Hygiene
clone_on_ref_ptr = "deny"
redundant_clone = "deny"
str_to_string = "deny"
implicit_clone = "deny"

# Cast Safety
as_conversions = "deny"
as_underscore = "deny"
as_pointer_underscore = "deny"
fn_to_numeric_cast_any = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_ptr_alignment = "deny"
lossy_float_literal = "deny"
float_cmp = "deny"
float_cmp_const = "deny"

# Safety Invariants
suspicious_xor_used_as_pow = "deny"
mem_forget = "deny"
exit = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
mutex_atomic = "deny"
infinite_loop = "deny"
try_err = "deny"
map_err_ignore = "deny"
let_underscore_must_use = "deny"

# Production Panic / Indexing / Debug Guards (exempted in tests via .clippy.toml)
todo = "warn"
unimplemented = "warn"
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"
unreachable = "warn"
unwrap_in_result = "warn"
panic_in_result_fn = "warn"
indexing_slicing = "warn"
string_slice = "warn"
get_unwrap = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

# ==============================================================================
# CUSTOM COMPILATION PROFILES
# ==============================================================================
[profile.fast]
inherits = "dev"
opt-level = 0
debug = 0
strip = "none"
panic = "abort"
debug-assertions = false
overflow-checks = false
incremental = true
codegen-units = 256

[profile.fast.package."*"]
opt-level = 0

[profile.perf]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
debug-assertions = false
overflow-checks = false

[profile.min-size]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
debug-assertions = false
overflow-checks = false

[profile.dist]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
debug-assertions = false
overflow-checks = false

# ==============================================================================
# CARGO-DIST (Automated Cross-Compiled Binary Releases)
# ==============================================================================
[workspace.metadata.dist]
cargo-dist-version = "0.28.0"
ci = "github"
installers = ["shell"]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
