name: Cross-Platform Check

# Enabled on workflow_dispatch until DX-04 gates `nix` under `cfg(unix)` and
# isolates Linux-only `bwrap` integration tests for macOS/Windows runners.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  cross-platform:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets --all-features
