name: CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "ARCHITECTURE.md"
      - "assets/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE-APACHE"
      - "LICENSE-MIT"
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "ARCHITECTURE.md"
      - "assets/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE-APACHE"
      - "LICENSE-MIT"

env:
  CARGO_TERM_COLOR: always
  # Note: Do not set RUSTFLAGS: "-D warnings" here. Setting RUSTFLAGS in the environment
  # overrides [target.*].rustflags in .cargo/config.toml, which strips --force-warn and
  # breaks the Tier 3 lint architecture. Strict linting is enforced via `cargo clippy`.

jobs:
  sanity:
    name: Sanity & File Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sanity check (no credentials or oversized files)
        run: |
          echo "==> Verifying no sensitive .env files committed..."
          if find . -maxdepth 3 \( -name ".env" -o -name ".env.local" \) | grep -v "/target/" | grep .; then
            echo "::error::Sensitive .env files detected in repository."
            exit 1
          fi

          echo "==> Verifying no oversized binaries (>25MB)..."
          OVERSIZED=$(find . -type f -not -path "*/.*/*" -not -path "./target/*" -size +25M)
          if [ -n "$OVERSIZED" ]; then
            echo "::error::Files exceeding 25MB detected: $OVERSIZED"
            exit 1
          fi
          echo "==> Sanity checks passed cleanly."

  security-audit:
    name: Supply Chain & License Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (Stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny, cargo-machete, typos, and taplo
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete,typos-cli,taplo-cli

      - name: Security, License & Banned Dependency Audit (cargo-deny)
        env:
          RUSTC_WRAPPER: ""
          RUSTC_WORKSPACE_WRAPPER: ""
        run: cargo deny check

      - name: Unused Dependency Audit (cargo-machete)
        run: cargo machete

      - name: Source Spellcheck (typos)
        run: typos

      - name: Verify TOML formatting (taplo)
        run: taplo fmt --check

  quality-gate:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (bubblewrap)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Configure kernel parameters for sandbox tests
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install Rust toolchain (Stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "torqkage-cache"

      - name: Install cargo-nextest, cargo-hack, and cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-hack,cargo-llvm-cov

      - name: Verify code formatting (rustfmt)
        run: cargo fmt --check

      - name: Verify compilation across all workspace crates, benches, and examples
        run: cargo check --workspace --all-targets --benches --examples

      - name: Verify fuzz targets compile cleanly
        run: cargo check --manifest-path fuzz/Cargo.toml

      - name: Enforce strict pedantic linter clean rules across feature powerset (cargo-hack + clippy)
        run: cargo hack clippy --workspace --all-targets --feature-powerset -- -D warnings

      - name: Verify Rustdoc generation with zero warnings
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --all-features

      - name: Execute automated unit, property, and snapshot tests (default features)
        run: cargo nextest run --workspace --profile ci --locked

      - name: Execute workspace tests with source-based code coverage (all features)
        run: cargo llvm-cov nextest --workspace --profile ci --all-features --locked --summary-only

      - name: Execute documentation tests
        run: cargo test --workspace --doc --locked
