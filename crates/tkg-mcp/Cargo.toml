[package]
name = "tkg-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
documentation.workspace = true
description = "TorqKage declarative Model Context Protocol (MCP) server & security firewall for AI coding agents (Claude Code, OpenCode, Cursor, Antigravity) with Bubblewrap sandboxing"
readme.workspace = true
keywords = ["mcp", "ai", "agents", "sandbox", "claude"]
categories.workspace = true

[dependencies]
tkg-common = { workspace = true, features = ["diagnostics"] }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
which = { workspace = true }
mpatch = { workspace = true }
regex = { workspace = true }
anstream = { workspace = true }
ignore = { workspace = true }
grep-regex = { workspace = true }
grep-searcher = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/torqkage-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
