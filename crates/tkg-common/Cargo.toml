[package]
name = "tkg-common"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
documentation.workspace = true
description = "Core engine for TorqKage: declarative MCP tool resolution, AST/comment policy filters, Bubblewrap sandboxing, and Jujutsu workspace isolation"
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
sqlite = ["dep:rusqlite"]
diagnostics = ["dep:tracing-subscriber"]

[dependencies]
bitflags = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }
thiserror = { workspace = true }
command-group = { workspace = true }
jiff = { workspace = true }
rustc-hash = { workspace = true }
toml = { workspace = true }
globset = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal", "process", "poll", "fs"] }

[dev-dependencies]
divan = { workspace = true }
gungraun = { workspace = true }
proptest = { workspace = true }
insta = { workspace = true }

[[bench]]
name = "core_benches"
harness = false

[[bench]]
name = "gungraun_bench"
harness = false

[lints]
workspace = true
